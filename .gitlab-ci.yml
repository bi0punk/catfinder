# CI/CD en GitLab. GitHub solo aloja el código.
# El job `deploy` es manual y necesita un runner con tag `local` en la máquina
# donde corre Docker Compose. Los jobs de `build` requieren un runner con
# Docker privilegiado (dind) y un Container Registry habilitado.

stages:
  - quality
  - test
  - audit
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

quality:
  stage: quality
  script:
    - pip install --no-deps -e .
    - pip install ruff mypy vulture bandit
    - ruff check .
    - mypy app
    - vulture app scripts
    - bandit -q -r app scripts

test:
  stage: test
  script:
    - pip install --no-deps -e .
    - pip install flask==3.1.3 python-dotenv==1.2.4 PyYAML==6.0.3 requests==2.34.2 "numpy>=1.24,<3" opencv-python-headless==5.0.0.93 pytest==9.2.0 pytest-cov
    - pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

audit:
  stage: audit
  script:
    - pip install --no-deps -e .
    - pip install flask==3.1.3 python-dotenv==1.2.4 PyYAML==6.0.3 requests==2.34.2 "numpy>=1.24,<3" opencv-python-headless==5.0.0.93 pytest==9.2.0 pytest-cov
    - pip install pip-audit
    - pip-audit --skip-editable

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - if [ -z "$CI_REGISTRY" ]; then echo "Sin Container Registry configurado"; exit 0; fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: docker:27
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - [local]
  script:
    - docker compose up -d --build
