services:
  catfinder:
    build: .
    image: ghcr.io/bi0punk/catfinder:latest
    container_name: catfinder_pro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Santiago
      # Dentro del contenedor hay que escuchar en 0.0.0.0 para el mapeo de puertos.
      # Define WEB_PASSWORD en .env para no exponer el panel sin auth.
      - WEB_HOST=0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./captures:/app/captures
      - ./models:/app/models:ro
    shm_size: "512mb"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
