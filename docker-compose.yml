services:
  catfinder:
    build: .
    container_name: catfinder_pro
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Santiago
      # Dentro del contenedor hay que escuchar en 0.0.0.0 para el mapeo de puertos.
      # Define WEB_PASSWORD en .env para no exponer el panel sin auth.
      - WEB_HOST=0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./captures:/app/captures
      - ./models:/app/models:ro
    shm_size: "512mb"
