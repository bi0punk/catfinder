name: Propuesta de mejora
description: Nueva funcionalidad o mejora de la existente
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema que resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Detección / modelo
        - RTSP / captura
        - Web / API
        - Telegram
        - Despliegue / CI
        - Documentación
