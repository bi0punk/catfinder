name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar proyecto y herramientas
        run: |
          uv pip install --no-deps -e .
          uv pip install ruff mypy vulture bandit
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Vulture
        run: vulture app scripts
      - name: Bandit
        run: bandit -q -r app scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python ${{ matrix.python-version }}
      - name: Instalar proyecto sin dependencias pesadas
        run: uv pip install --no-deps -e .
      - name: Instalar dependencias de test
        run: |
          uv pip install \
            flask==3.1.3 python-dotenv==1.2.2 PyYAML==6.0.2 requests==2.33.0 \
            "numpy>=1.24,<3" opencv-python-headless==4.10.0.84 \
            pytest==9.0.3 pytest-cov
      - name: Pytest con cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar dependencias de ejecución
        run: |
          uv pip install --no-deps -e .
          uv pip install \
            flask==3.1.3 python-dotenv==1.2.2 PyYAML==6.0.2 requests==2.33.0 \
            "numpy>=1.24,<3" opencv-python-headless==4.10.0.84
          uv pip install pip-audit
      - name: Auditar dependencias
        run: .venv/bin/pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
