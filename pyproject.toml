[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["scripts/"]

[tool.vulture]
min_confidence = 60
# Rutas registradas via decoradores de Flask: vulture no las detecta como usadas.
ignore_decorators = ["@app.route", "@require_auth"]
# Campo real de EventRecord (dataclass): lo usa el constructor y la serialización.
ignore_names = ["ts_utc"]
